<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>filme romântico</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>Filme Romântico</h1>
  </header>

  <main>
    <div class="filme">
      <h2>Bonito</h2>

      <!-- IMAGEM CENTRAL (Usa uma foto de exemplo que já funciona, mas podem trocar o link) -->
      <div class="area-imagem">
        <img 
          src="filme-romantico.jpg"
          alt="vários artistas" 
          class="foto-destaque"
        >
      </div>

      <p>Gosto de assistir filmes românticos.</p>

      <!-- FORMULÁRIO INTERATIVO -->
      <form>
        <h3>No cinema</h3>

        <p>
          <label for="nome-visitante">Digite seu nome:</label>
          <input type="text" id="nome-visitante" placeholder="Rosimar">
        </p>

        <!-- Exemplo de RADIO (Escolha ÚNICA) -->
        <fieldset>
          <legend>1. Escolha apenas UMA opção favorita:</legend>
          
          <input type="radio" id="op1" name="favorito" value="opcao1">
          <label for="op1">Primeira opção</label><br>

          <input type="radio" id="op2" name="favorito" value="opcao2">
          <label for="op2">Segunda opção</label>
        </fieldset>

        <!-- Exemplo de CHECKBOX (Escolha MÚLTIPLA - Novidade!) -->
        <fieldset>
          <legend>2. Marque TODAS as opções que você gosta (Checkbox):</legend>

          <input type="checkbox" id="check1" name="interesses" value="item1">
          <label for="check1">Gosto de tecnologia e jogos</label><br>

          <input type="checkbox" id="check2" name="interesses" value="item2">
          <label for="check2">Gosto de filmes e séries</label><br>

          <input type="checkbox" id="check3" name="interesses" value="item3">
          <label for="check3">Gosto de música e esportes</label>
        </fieldset>

        <button type="submit">Enviar Respostas</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Atividade de fixação de CSS - 2026</p>
  </footer>

</body>
